<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e3628">
<title>Can't reach CasaVilla</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e3628; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bg { position: fixed; inset: 0; background: url(/launch.jpg) center/cover no-repeat; }
  .shade { position: fixed; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.6) 50%, rgba(0,0,0,.85)); }
  main { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 22vh 32px 40px; }
  .logo { height: 80px; width: auto; }
  .icon { margin-top: 48px; width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; }
  h1 { margin: 20px 0 0; font-size: 20px; font-weight: 600; }
  p { margin: 8px 0 0; max-width: 300px; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.75); }
  button { margin-top: 28px; border: 0; border-radius: 12px; background: #d2a84a; color: #09251b; font: 600 15px/1 inherit; padding: 14px 32px; }
  small { display: block; margin-top: 16px; font-size: 12px; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<div class="bg"></div><div class="shade"></div>
<main>
  <img class="logo" src="/logo-light.png" alt="CasaVilla">
  <div class="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ddbb66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/></svg></div>
  <h1>Can't reach CasaVilla</h1>
  <p>Check your data or Wi-Fi. If other apps work, your network may be having trouble reaching us — switching between Wi-Fi and mobile data usually helps.</p>
  <button id="retry" type="button">Try again</button>
  <small>We'll reconnect automatically.</small>
</main>
<script>
  // Shown by the service worker at the address the person asked for, so reloading retries that page.
  var b = document.getElementById("retry");
  function go() { b.textContent = "Connecting…"; location.reload(); }
  b.onclick = go;
  window.addEventListener("online", go);
  setInterval(function () {
    fetch("/manifest.webmanifest", { cache: "no-store" }).then(function (r) { if (r.ok) go(); }).catch(function () {});
  }, 10000);
</script>
</body>
</html>
